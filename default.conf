# ----------------------------------------------------
# HTTP -> HTTP
# ----------------------------------------------------
server {
    listen 80;
    server_name _;
 
    # ----------------------------------------------------
    # Global proxy defaults (REQUIRED for Azure CA)
    # ----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
 
    # ACA requires SNI for HTTPS upstreams
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
 
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
 
    # ----------------------------------------------------
    # Health check
    # ----------------------------------------------------
    location /health/ {
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------------------
    # test
    # ----------------------------------------------------
    location /api/items/ {
        proxy_pass https://test-backend.internal.jollymushroom-14b7b2ef.eastus.azurecontainerapps.io/api/items/;

        proxy_ssl_name test-backend.internal.jollymushroom-14b7b2ef.eastus.azurecontainerapps.io;
        proxy_set_header Host $proxy_host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


        
    # ----------------------------------------------------
    # Error handling
    # ----------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

}
